name: SmartTube VR - UI preview (emulator screenshots and video)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the "Quest APK" build whose universal APK should be previewed'
        required: true
      video_url:
        description: 'Video to open'
        required: false
        default: 'https://www.youtube.com/watch?v=aqz-KE-bpKQ'
permissions:
  contents: write
  actions: read
concurrency:
  group: smarttube-vr-ui-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SmartTube VR tools
        uses: actions/checkout@v4
        with:
          path: enhancements
      - name: Download the universal APK of that build
        uses: actions/download-artifact@v4
        with:
          name: SmartTube-VR-universal-debug
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app in an emulator, take screenshots and record a video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -change-locale es-ES
          disable-animations: true
          script: bash enhancements/tools/ui_preview.sh apk "${{ inputs.video_url }}" preview
      - name: Upload screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-VR-ui-preview
          path: preview
          if-no-files-found: warn
      - name: Publish them to the ui-preview branch (easy to browse on GitHub)
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [ -d preview ] || exit 0
          cd preview
          git init -q
          git checkout -q -b ui-preview
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Vista previa de la interfaz VR (APK del run $RUN)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ui-preview
